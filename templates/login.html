<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FillForge Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2540; --navy-2:#2a3554; --orange:#f47b20;
  --bg:#f6f7fb; --white:#fff; --border:#e3e6ef;
  --text:#1a1d23; --muted:#6b7280; --danger:#dc2626;
  font-family:'Inter',sans-serif;
}
body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--white);border-radius:16px;padding:48px;width:100%;max-width:420px;box-shadow:0 8px 32px #1a254012}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;margin:0 auto 16px;position:relative;overflow:hidden}
.logo-icon::after{content:"";position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;background:var(--orange);border-radius:50%}
.logo-icon span{position:relative;z-index:1}
.logo h1{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.5px}
.logo h1 em{font-style:normal;color:var(--orange)}
.logo p{font-size:13px;color:var(--muted);margin-top:4px}

.form-group{margin-bottom:20px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);transition:all .15s}
input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px #f47b2015}
input::placeholder{color:#9ca3af}

.btn{width:100%;padding:14px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;font-family:inherit}
.btn:hover{background:var(--navy-2)}
.btn:disabled{background:#a8afc4;cursor:not-allowed}
.btn-spinner{width:16px;height:16px;border:2px solid #ffffff60;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;margin-right:8px;vertical-align:middle}
.btn.loading .btn-spinner{display:inline-block}
.btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.error{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--danger);margin-top:12px;display:none}
.error.show{display:block}

.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.6}
.hint a{color:var(--orange);text-decoration:none;font-weight:500}
.hint a:hover{text-decoration:underline}

.step{display:none}
.step.active{display:block}

.otp-display{font-size:32px;font-weight:700;letter-spacing:8px;color:var(--navy);text-align:center;margin:20px 0;font-family:monospace}
.dev-mode{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px;font-size:13px;color:#92400e;margin-bottom:16px}
.dev-mode strong{color:#92400e}

.back-btn{background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;margin-bottom:16px;transition:color .15s}
.back-btn:hover{color:var(--navy)}
.back-btn svg{width:16px;height:16px}

@media(max-width:480px){
  .login-box{padding:32px 24px}
}
</style>
<base target="_blank">
</head>
<body>

<div class="login-box">
  <div class="logo">
    <div class="logo-icon"><span>F</span></div>
    <h1>Fill<em>Forge</em></h1>
    <p>Jumbotail Catalog Operations</p>
  </div>

  <!-- STEP 1: Email -->
  <div class="step active" id="step1">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@company.com" autofocus>
    </div>
    <button class="btn" id="btn-send" onclick="sendOTP()">
      <span class="btn-spinner"></span>
      <span class="btn-text">Send OTP</span>
    </button>
    <div class="error" id="err1"></div>
  </div>

  <!-- STEP 2: OTP -->
  <div class="step" id="step2">
    <button class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </button>
    <div class="form-group">
      <label>Enter OTP</label>
      <input type="text" id="otp" placeholder="6-digit code" maxlength="6" inputmode="numeric">
    </div>
    <div class="dev-mode hidden" id="dev-mode">
      <strong>Dev Mode:</strong> OTP printed in server console
    </div>
    <button class="btn" id="btn-verify" onclick="verifyOTP()">
      <span class="btn-spinner"></span>
      <span class="btn-text">Verify & Login</span>
    </button>
    <div class="error" id="err2"></div>
    <p class="hint">Didn't receive? <a href="#" onclick="resendOTP()">Resend OTP</a></p>
  </div>
</div>

<script>
let currentEmail = '';

function showError(id, msg){
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}
function hideError(id){
  document.getElementById(id).classList.remove('show');
}
function setLoading(id, loading){
  document.getElementById(id).classList.toggle('loading', loading);
  document.getElementById(id).disabled = loading;
}

async function sendOTP(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  if(!email || !email.includes('@')){
    showError('err1', 'Please enter a valid email address');
    return;
  }

  hideError('err1');
  setLoading('btn-send', true);

  try{
    const res = await fetch('/auth/send_otp', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email})
    });
    const data = await res.json();

    if(data.error){
      showError('err1', data.error);
      setLoading('btn-send', false);
      return;
    }

    currentEmail = email;
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
    document.getElementById('otp').focus();

    if(data.dev){
      document.getElementById('dev-mode').classList.remove('hidden');
    }

  }catch(e){
    showError('err1', 'Network error. Please try again.');
    setLoading('btn-send', false);
  }
}

async function verifyOTP(){
  const otp = document.getElementById('otp').value.trim();
  if(otp.length !== 6 || !/^\d+$/.test(otp)){
    showError('err2', 'Please enter a valid 6-digit OTP');
    return;
  }

  hideError('err2');
  setLoading('btn-verify', true);

  try{
    const res = await fetch('/auth/verify_otp', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: currentEmail, otp})
    });
    const data = await res.json();

    if(data.error){
      showError('err2', data.error);
      setLoading('btn-verify', false);
      return;
    }

    // Success — redirect to app
    window.location.href = '/';

  }catch(e){
    showError('err2', 'Network error. Please try again.');
    setLoading('btn-verify', false);
  }
}

function resendOTP(){
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  hideError('err1');
  hideError('err2');
  sendOTP();
}

function goBack(){
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  hideError('err1');
  hideError('err2');
}

// Enter key support
document.getElementById('email').addEventListener('keypress', e => {
  if(e.key === 'Enter') sendOTP();
});
document.getElementById('otp').addEventListener('keypress', e => {
  if(e.key === 'Enter') verifyOTP();
});
</script>

</body>
</html>
