<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FillForge · Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2540; --navy-2:#2a3554; --orange:#f47b20; --orange-2:#ff6b1a;
  --bg:#f6f7fb; --white:#fff; --border:#e3e6ef; --border-2:#cdd2e0;
  --text:#1a1d23; --muted:#6b7280; --muted-2:#9ca3af;
  --danger:#dc2626; --danger-bg:#fef2f2; --success:#059669; --success-bg:#ecfdf5;
}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f6f7fb 0%,#eef0f7 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--white);border-radius:16px;box-shadow:0 12px 40px #1a25401a;width:100%;max-width:420px;padding:36px 36px 28px;border:1px solid var(--border)}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;position:relative;overflow:hidden}
.logo-mark::after{content:"";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;background:var(--orange);border-radius:50%;opacity:.95}
.logo-mark span{position:relative;z-index:1}
.brand-text{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.5px}
.brand-text em{font-style:normal;color:var(--orange)}
.tagline{font-size:11px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:28px;border-top:1px solid var(--border);padding-top:10px}
h2{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px}
.sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text);margin-bottom:6px}
.field input{width:100%;padding:11px 14px;border:1px solid var(--border-2);border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:all .15s;background:var(--white)}
.field input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f47b2020}
.field input.otp{font-size:20px;letter-spacing:8px;text-align:center;font-weight:600;font-family:'SF Mono',Menlo,monospace}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-primary:disabled{background:#a8afc4;cursor:not-allowed}
.btn-link{background:transparent;color:var(--orange);font-weight:500;padding:8px;font-size:12px;margin-top:8px}
.btn-link:hover{text-decoration:underline}
.msg{padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;display:none}
.msg.error{background:var(--danger-bg);color:var(--danger);border:1px solid #fca5a5}
.msg.success{background:var(--success-bg);color:var(--success);border:1px solid #a7f3d0}
.msg.show{display:block}
.spinner{width:14px;height:14px;border:2px solid #ffffff60;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
.btn.loading .spinner{display:block}.btn.loading .label{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{text-align:center;font-size:11px;color:var(--muted-2);margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.email-display{background:var(--bg);padding:9px 12px;border-radius:6px;font-size:13px;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border)}
.email-display .change{font-size:11px;color:var(--orange);cursor:pointer;font-weight:500}
.email-display .change:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-mark"><span>F</span></div>
    <div class="brand-text">Fill<em>Forge</em></div>
  </div>
  <div class="tagline">Automate · Accurate · Accelerate</div>

  <div id="step-email">
    <h2>Sign in</h2>
    <p class="sub">Enter your email to receive a 6-digit verification code.</p>
    <div class="msg" id="msg-1"></div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
    </div>
    <button class="btn btn-primary" id="btn-send" onclick="sendOTP()">
      <span class="spinner"></span><span class="label">Send verification code</span>
    </button>
  </div>

  <div id="step-otp" style="display:none">
    <h2>Enter verification code</h2>
    <p class="sub">We sent a 6-digit code to your email. It expires in 5 minutes.</p>
    <div class="email-display">
      <span id="email-show"></span>
      <span class="change" onclick="backToEmail()">Change</span>
    </div>
    <div class="msg" id="msg-2"></div>
    <div class="field">
      <input type="text" id="otp" class="otp" maxlength="6" inputmode="numeric" placeholder="000000" autocomplete="one-time-code">
    </div>
    <button class="btn btn-primary" id="btn-verify" onclick="verifyOTP()">
      <span class="spinner"></span><span class="label">Verify & continue</span>
    </button>
    <button class="btn btn-link" onclick="sendOTP(true)">Resend code</button>
  </div>

  <div class="foot">FillForge v0.3 Beta · Jumbotail Catalog Operation Portal</div>
</div>

<script>
const $ = id => document.getElementById(id);
function showMsg(id, txt, type){const m=$(id);m.textContent=txt;m.className='msg '+type+' show'}
function clearMsg(id){$(id).classList.remove('show')}
function setLoading(btn,on){btn.classList.toggle('loading',on);btn.disabled=on}

async function sendOTP(resend=false){
  const email=$('email').value.trim().toLowerCase();
  if(!email||!email.includes('@')){showMsg('msg-1','Please enter a valid email','error');return}
  clearMsg('msg-1');clearMsg('msg-2');
  const btn=resend?$('btn-verify'):$('btn-send');setLoading(btn,true);
  try{
    const r=await fetch('/auth/send_otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json();
    if(!r.ok){showMsg(resend?'msg-2':'msg-1',d.error||'Failed','error');return}
    $('email-show').textContent=email;
    $('step-email').style.display='none';$('step-otp').style.display='block';
    showMsg('msg-2','Code sent — check your inbox','success');
    setTimeout(()=>$('otp').focus(),100);
  }catch(e){showMsg('msg-1','Network error','error')}
  finally{setLoading(btn,false)}
}
async function verifyOTP(){
  const email=$('email-show').textContent;
  const otp=$('otp').value.trim();
  if(otp.length!==6){showMsg('msg-2','Enter the 6-digit code','error');return}
  clearMsg('msg-2');setLoading($('btn-verify'),true);
  try{
    const r=await fetch('/auth/verify_otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,otp})});
    const d=await r.json();
    if(!r.ok){showMsg('msg-2',d.error||'Failed','error');return}
    showMsg('msg-2','Success — redirecting','success');
    setTimeout(()=>location.href='/',500);
  }catch(e){showMsg('msg-2','Network error','error')}
  finally{setLoading($('btn-verify'),false)}
}
function backToEmail(){$('step-otp').style.display='none';$('step-email').style.display='block';clearMsg('msg-1');clearMsg('msg-2')}
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')sendOTP()});
$('otp').addEventListener('keydown',e=>{if(e.key==='Enter')verifyOTP()});
$('otp').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'')});
</script>
</body>
</html>
