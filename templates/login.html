<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FillForge Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .logo { font-size: 28px; font-weight: 800; color: #E87722; margin-bottom: 4px; }
    .sub  { color: #888; font-size: 13px; margin-bottom: 32px; }
    label { font-size: 13px; font-weight: 600; color: #444; display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 15px; outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #E87722; }
    .btn {
      width: 100%; padding: 13px; background: #E87722; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 16px; transition: background 0.2s;
    }
    .btn:hover { background: #cf6310; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 20px; }
    .msg.error { color: #e53e3e; }
    .msg.success { color: #38a169; }
    .otp-group { display: none; margin-top: 20px; }
    .resend { font-size: 12px; color: #E87722; cursor: pointer;
              text-align: right; margin-top: 6px; display: none; }
    .resend:hover { text-decoration: underline; }
    .timer { font-size: 12px; color: #888; text-align: right; margin-top: 6px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">FillForge</div>
  <div class="sub">Catalog Ops — Sign in to continue</div>

  <div id="emailGroup">
    <label for="emailInput">Work Email</label>
    <input type="email" id="emailInput" placeholder="you@company.com" autocomplete="email"/>
    <button class="btn" id="sendBtn" onclick="sendOTP()">Send OTP</button>
  </div>

  <div class="otp-group" id="otpGroup">
    <label for="otpInput">Enter OTP <span style="color:#888;font-weight:400">(sent to <span id="emailDisplay"></span>)</span></label>
    <input type="text" id="otpInput" placeholder="6-digit code" maxlength="6"
           autocomplete="one-time-code" oninput="this.value=this.value.replace(/\D/g,'')"
           onkeydown="if(event.key==='Enter') verifyOTP()"/>
    <button class="btn" id="verifyBtn" onclick="verifyOTP()">Verify & Login</button>
    <div class="timer" id="timer"></div>
    <div class="resend" id="resendBtn" onclick="sendOTP(true)">Resend OTP</div>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
  let email = '';
  let timerInterval = null;

  function showMsg(text, type='error') {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  function startTimer(seconds=600) {
    clearInterval(timerInterval);
    const timerEl  = document.getElementById('timer');
    const resendEl = document.getElementById('resendBtn');
    resendEl.style.display = 'none';
    let remaining = seconds;
    timerEl.textContent = `OTP expires in ${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;
    timerInterval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(timerInterval);
        timerEl.textContent = 'OTP expired';
        resendEl.style.display = 'block';
      } else {
        timerEl.textContent = `OTP expires in ${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;
      }
    }, 1000);
  }

  async function sendOTP(resend=false) {
    email = document.getElementById('emailInput').value.trim().toLowerCase();
    if (!email || !email.includes('@')) { showMsg('Please enter a valid email'); return; }
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    showMsg('');
    try {
      const res  = await fetch('/auth/send_otp', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email})
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('emailGroup').style.opacity = '0.5';
        document.getElementById('emailGroup').style.pointerEvents = 'none';
        document.getElementById('otpGroup').style.display = 'block';
        document.getElementById('emailDisplay').textContent = email;
        document.getElementById('otpInput').focus();
        startTimer(600);
        showMsg(resend ? 'New OTP sent!' : 'OTP sent! Check your inbox.', 'success');
      } else {
        showMsg(data.error || 'Failed to send OTP');
        btn.disabled = false;
        btn.textContent = 'Send OTP';
      }
    } catch(e) {
      showMsg('Network error. Try again.');
      btn.disabled = false;
      btn.textContent = 'Send OTP';
    }
  }

  async function verifyOTP() {
    const otp = document.getElementById('otpInput').value.trim();
    if (otp.length !== 6) { showMsg('Enter the 6-digit OTP'); return; }
    const btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    btn.textContent = 'Verifying...';
    showMsg('');
    try {
      const res  = await fetch('/auth/verify_otp', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email, otp})
      });
      const data = await res.json();
      if (res.ok) {
        showMsg('Login successful! Redirecting...', 'success');
        clearInterval(timerInterval);
        setTimeout(() => window.location.href = '/', 800);
      } else {
        showMsg(data.error || 'Invalid OTP');
        btn.disabled = false;
        btn.textContent = 'Verify & Login';
      }
    } catch(e) {
      showMsg('Network error. Try again.');
      btn.disabled = false;
      btn.textContent = 'Verify & Login';
    }
  }
</script>
</body>
</html>
